<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dépannage Git</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #24292f;
      --muted: #57606a;
      --border: #d0d7de;
      --acronym: #f6f8fa;
      --accent: #0969da;
      --danger: #b42318;
      --danger-bg: #fff5f5;
    }

    * { box-sizing: border-box; }

    body {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--fg);
      background: var(--bg);
    }

    header h1 {
      margin-bottom: 0.25rem;
      font-size: 2rem;
    }

    header > p {
      margin-top: 0;
      color: var(--muted);
    }

    nav {
      padding: 1rem 1.25rem;
      margin: 1.5rem 0 2.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--acronym);
    }

    nav h2 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
    }

    nav ul {
      margin: 0;
      padding-left: 1.25rem;
    }

    nav a,
    main a {
      color: var(--accent);
      text-decoration: none;
    }

    nav a:hover,
    main a:hover {
      text-decoration: underline;
    }

    section {
      margin-bottom: 2.5rem;
    }

    section h2 {
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--border);
    }

    code {
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      background: var(--acronym);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.9em;
    }

    pre {
      padding: 1rem;
      border-radius: 6px;
      background: var(--acronym);
      overflow-x: auto;
    }

    pre code {
      padding: 0;
      background: none;
      font-size: 0.875rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }

    th,
    td {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      text-align: left;
    }

    th {
      background: var(--acronym);
    }

    blockquote {
      margin: 1rem 0;
      padding: 0.5rem 1rem;
      border-left: 4px solid var(--accent);
      background: var(--acronym);
      color: var(--muted);
    }

    .danger {
      padding: 0.75rem 1rem;
      border: 1px solid var(--danger);
      border-radius: 6px;
      background: var(--danger-bg);
      color: var(--danger);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>Dépannage Git</h1>
    <p>Fiche de secours : que faire quand ça part mal. Les commandes sont données pour ce dépôt (branches <code>main</code> et <code>develop</code>).</p>
  </header>

  <nav>
    <h2>Sommaire</h2>
    <ul>
    </ul>
  </nav>

  <main>
  </main>

</body>
</html>
